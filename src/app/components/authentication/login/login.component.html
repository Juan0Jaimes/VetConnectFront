<div
    class="h-100vh pt-50 pb-50"
    [class.component-dark-theme]="themeService.isDark()"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.card-border-radius]="themeService.isCardBorderRadius()"
    [class.component-rtl-enabled]="themeService.isRTLEnabled()"
>
    <div class="d-table">
        <div class="d-table-cell">
            <div class="tagus-form ms-auto me-auto">
                <div class="title">
                    <div class="d-flex mb-10 align-items-center">
                        <h2 class="mb-0 me-30">Empezar</h2>
                        <img src="assets/img/logo-icon.png" alt="logo-icon">
                    </div>
                    <!-- <p>No tienes una cuenta? <a routerLink="/authentication/register" class="main-color fw-medium">Regístrate ahora!</a></p> -->
                </div>
                <form [formGroup]="form">
                    <!-- <div class="login-with-socials d-md-flex align-items-center justify-content-space-between">
                        <button mat-flat-button class="gray fw-semibold d-block me-5"><img src="assets/img/icon/google.png" alt="google"> Login with Google</button>
                        <button mat-flat-button class="tagus fw-semibold d-block ms-5"><img src="assets/img/icon/facebook.png" alt="facebook"> Login with Facebook</button>
                    </div>
                    <div class="or text-center position-relative">
                        <span class="fw-semibold fs-16">or</span>
                    </div> -->
                    <div class="bg-white border-radius pt-20 ps-20 pe-20">
                        <div class="tagus-form-group without-icon">
                            <label class="d-block mb-12 fw-semibold gray-color">Dirección de correo electrónico <span>*</span></label>
                            <mat-form-field appearance="fill">
                                <mat-label>Ingresa el correo electrónico</mat-label>
                                <input matInput  formControlName="username" [class.is-invalid]="form.get('username')!.touched && form.get('username')!.invalid">
                            </mat-form-field>
                        </div>
                        <div class="tagus-form-group without-icon">
                            <label class="d-block mb-12 fw-semibold gray-color">Contraseña <span>*</span></label>
                            <mat-form-field appearance="fill">
                                <mat-label>Ingresa tu contraseña</mat-label>
                                <input matInput [type]="hide ? 'password' : 'text'"  formControlName="password" [class.is-invalid]="form.get('password')!.touched && form.get('password')!.invalid">
                                <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                                    <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                                </button>
                            </mat-form-field>
                        </div>
                    </div>
                    <!-- <div class="d-flex info align-items-center justify-content-space-between">
                        <mat-checkbox class="gray-color">Recuerdame</mat-checkbox>
                        <a routerLink="/authentication/forgot-password" class="d-inline-block main-color fw-medium">¿Olvidaste tu contraseña?</a>
                    </div> -->
                    <button mat-flat-button class="tagus d-block fw-semibold" (click)="onLogin()">Iniciar sesión</button>
                </form>
            </div>
        </div>
    </div>
</div>
